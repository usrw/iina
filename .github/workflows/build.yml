name: Build iina

on:
  push:
    branches:
      - with-pr-5557          # 或你想编译的分支
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'  # 对应你本地 Xcode 版本，可改成最新 stable

      - name: Install dependencies (CocoaPods)
        run: |
          sudo gem install cocoapods
          pod install --project-directory=iina

      - name: Build iina
        run: |
          xcodebuild -workspace iina/iina.xcworkspace \
            -scheme iina \
            -configuration Release \
            -arch arm64 \
            clean build | xcpretty

      - name: Upload built .app
        uses: actions/upload-artifact@v3
        with:
          name: iina-app
          path: iina/build/Release/iina.app
